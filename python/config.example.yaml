# Station: Los Angeles (validation only here for this project).
station:
  lat: 34.0522
  lon: -118.2437

usgs:
  radius_km: 160               # ~100 miles, like the quakes.html tool
  min_magnitude: 2.0           # threshold for correlation / calibration (>= M2)
  display_min_magnitude: 0.5   # threshold for the dashboard map (full context)
  poll_interval_s: 60          # how often we query the catalog
  lookback_minutes: 1440       # history window fetched for display/correlation

correlation:
  match_window_s: 180   # local timestamp <-> USGS origin time window

source:
  # "bridge" = the real UNO Q under App Lab. The sketch sends one
  #   `seismic_event` RPC notification per detection and Python receives it
  #   through Bridge.provide. This is the only transport that works when App
  #   Lab runs the Python half in its container: the MCU's Monitor stream is
  #   not reachable from there, the router socket is.
  # "monitor" = read `arduino-app-cli monitor` as a subprocess. Only usable
  #   when Python runs on the board host (or over adb from a dev machine).
  # "serial" = raw tty. "mock" = hardware-free development.
  type: bridge
  monitor_command: arduino-app-cli monitor
  serial_port: /dev/ttyACM0
  baudrate: 115200

calibration:
  # Append-only journal, one JSON line per detection, recording what the models
  # predicted BEFORE they learned each event. `python audit.py` replays it to
  # get out-of-sample residuals; the RMSE the models report about themselves is
  # a training residual and is optimistic. Never rewritten, safe to keep.
  journal_file: event_log.jsonl
  state_file: calibration_state.json
  classifier_state_file: classifier_state.json
  distance_state_file: distance_state.json
  min_points: 8         # number of points before estimating a magnitude

# Autonomous mode: periodically publish the station snapshot (JSON) so the
# public page (web-remote/index.html) can display it. That page reads
# station.json from beside itself, so on GitHub Pages the target is
# web-remote/station.json in the repository.
publish:
  enabled: false
  method: command       # post | file | command
  # Each snapshot published to the repository is a commit that redeploys the
  # page, so this is deliberately slow. Detections are not lost in between:
  # every snapshot carries the recent ones.
  interval_s: 1800
  # method: post  -> HTTP POST to this endpoint (optional bearer token)
  url: https://example.org/api/station
  token: ""
  # method: file  -> atomic write to this path (synced/served folder)
  path: /var/www/station.json
  # method: command -> run this command; "{file}" is replaced by the JSON
  # temp file path (appended if no placeholder). Upload examples:
  #   GitHub Pages: needs SISMO_GITHUB_TOKEN, a fine-grained token limited to
  #   this repository with "Contents: read and write" and nothing else.
  #     python3 tools/publish-to-github.py {file}
  #   any other static host:
  #     scp -q {file} user@host:/var/www/station.json
  #     curl -sf -T {file} ftp://host/station.json --user user:pass
  command: "python3 tools/publish-to-github.py {file}"
