# Station position. These are downtown Los Angeles coordinates, kept here as a
# neutral placeholder so a fresh clone runs somewhere sensible — they are NOT
# where the reference station sits, and its real position is deliberately absent
# from this repository. Put your own here, in `python/config.yaml`, which is
# gitignored. Accuracy to the nearest town is plenty: this only seeds the USGS
# search centre and the epicentral distances, against a 160 km radius. Being
# wrong by ~15 km, as this project was until 2026-09-01, quietly biases every
# distance the correlation and the distance model compute.
station:
  lat: 34.0522
  lon: -118.2437

usgs:
  radius_km: 160               # ~100 miles, like the quakes.html tool
  min_magnitude: 2.0           # threshold for correlation / calibration (>= M2)
  display_min_magnitude: 0.5   # threshold for the dashboard map (full context)
  poll_interval_s: 60          # how often we query the catalog
  lookback_minutes: 1440       # history window fetched for display/correlation

correlation:
  # Outer bound on the search for a cataloged cause. The binding constraint is
  # tighter and physical: `find_match` also requires the delay to match the
  # body-wave travel time for that event's own hypocentral distance, so at 30 km
  # only the first ~27 s qualify, not the first 180 s. That matters because a
  # spurious match enters the calibration as ground truth, and the rate of
  # spurious matches is proportional to how much time the window covers.
  match_window_s: 180   # local timestamp <-> USGS origin time window

source:
  # "bridge" = the real UNO Q under App Lab. The sketch sends one
  #   `seismic_event` RPC notification per detection and Python receives it
  #   through Bridge.provide. This is the only transport that works when App
  #   Lab runs the Python half in its container: the MCU's Monitor stream is
  #   not reachable from there, the router socket is.
  # "monitor" = read `arduino-app-cli monitor` as a subprocess. Only usable
  #   when Python runs on the board host (or over adb from a dev machine).
  # "serial" = raw tty. "mock" = hardware-free development.
  type: bridge
  monitor_command: arduino-app-cli monitor
  serial_port: /dev/ttyACM0
  baudrate: 115200

calibration:
  # Append-only journal, one JSON line per detection, recording what the models
  # predicted BEFORE they learned each event. `python audit.py` replays it to
  # get out-of-sample residuals; the RMSE the models report about themselves is
  # a training residual and is optimistic. Never rewritten, safe to keep.
  journal_file: event_log.jsonl
  state_file: calibration_state.json
  classifier_state_file: classifier_state.json
  distance_state_file: distance_state.json
  min_points: 8         # number of points before estimating a magnitude

# Continuous envelope: the peak and the rms of the same 0.7-12 Hz signal the
# trigger uses, one value a second, written to one file per UTC day. About
# 1.6 MB a day. It exists so a cataloged earthquake can be looked for at the
# instant it must have arrived, instead of having to shout loudly enough to trip
# the blind trigger on its own.
envelope:
  enabled: true
  directory: envelope
  # Enforced on every day rollover. The board this runs on has ~950 MB free,
  # 10% of its disk, so this is a real limit and not a formality: 14 days is
  # ~23 MB. Raising it buys a longer retroactive reach and nothing else.
  retention_days: 14

# Retrospective search. See python/retro.py for what it is and, more
# importantly, what it is not: a shake found here was found because the catalog
# said where to look, so it is never counted as an autonomous detection.
retro:
  enabled: true
  state_file: retro_state.json
  interval_s: 900        # how often to re-scan
  # How far back each scan reaches. Worth more than a single pass: the USGS
  # revises magnitudes and locations for hours after an event, and a scan run a
  # minute after the origin time uses a distance that may still change.
  lookback_hours: 72
  # Significance required, in units of the LOCAL dispersion measured over the
  # minutes before the arrival. Calibrated against the null distribution of the
  # estimator itself — `python3 tools/retro-gain.py` prints it. At 4.0 the
  # measured false-confirmation rate on the station's own noise is under 1e-3
  # per event, i.e. ~1% over a fortnight.
  z_min: 4.0
  # Whether a retrospective confirmation may feed the amplitude and distance
  # models. OFF, and not merely out of caution. These points are selected for
  # being large excursions at a threshold close to the noise, so their
  # amplitudes are biased upward by the selection itself, and fitting a
  # magnitude law to them would bake that bias in. Turn it on only with a
  # comfortable margin above z_min and with the bias in mind.
  feed_calibration: false

# Autonomous mode: periodically publish the station snapshot (JSON) so the
# public page (web-remote/index.html) can display it. That page reads
# station.json from beside itself, so on GitHub Pages the target is
# web-remote/station.json in the repository.
publish:
  enabled: false
  method: command       # post | file | command
  # Each snapshot published to the repository is a commit that redeploys the
  # page, so this is deliberately slow. Detections are not lost in between:
  # every snapshot carries the recent ones. 1200 s keeps the worst case at
  # three builds an hour, well inside GitHub Pages' ~10/hour soft limit, and
  # the skip-if-unchanged guard means a quiet station commits nothing at all.
  interval_s: 1200
  # The station's coordinates stay out of what is published. The public page
  # shows the catalog and, on the events the device matched, the magnitude and
  # distance it read — none of which needs to know where the box sits. Set this
  # to true only if you actually want the address on a public map. Note that
  # the published distances to several known epicenters still trilaterate the
  # station roughly, so this hides an address, it does not anonymize.
  include_location: false
  # How far back the published list of shakes reaches. The page carries a
  # slider that narrows it, so this is the widest view a visitor can ask for,
  # not what they see by default. The calibration history is NOT windowed: it
  # is the whole point that it accumulates.
  window_days: 30
  # method: post  -> HTTP POST to this endpoint (optional bearer token)
  url: https://example.org/api/station
  token: ""
  # method: file  -> atomic write to this path (synced/served folder)
  path: /var/www/station.json
  # method: command -> run this command; "{file}" is replaced by the JSON
  # temp file path (appended if no placeholder). Upload examples:
  #   GitHub Pages: needs SISMO_GITHUB_TOKEN, a fine-grained token limited to
  #   this repository with "Contents: read and write" and nothing else.
  #     python3 tools/publish-to-github.py {file}
  #   any other static host:
  #     scp -q {file} user@host:/var/www/station.json
  #     curl -sf -T {file} ftp://host/station.json --user user:pass
  command: "python3 tools/publish-to-github.py {file}"
