<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a3"/>
    </marker>
    <marker id="swing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d7ebd"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#f7f8fa"/>

  <text x="40" y="56" font-size="30" font-weight="700" fill="#1c2430">Amplifying the ground before the sensor sees it</text>
  <text x="40" y="88" font-size="16" fill="#6b7684">The station's floor at rest is the accelerometer's own electrical noise. That noise is added after the mechanical path, so a resonance</text>
  <text x="40" y="110" font-size="16" fill="#6b7684">that multiplies ground motion multiplies the signal and not the noise &#8212; until it starts multiplying the ground's own noise too.</text>

  <!-- ============ LEFT: the build ============ -->
  <rect x="40" y="150" width="620" height="380" rx="12" fill="#ffffff" stroke="#dde2e9"/>
  <rect x="40" y="150" width="620" height="4" rx="2" fill="#3d7ebd"/>
  <text x="64" y="192" font-size="15" font-weight="700" fill="#1c2430">Tuned blade, 4 Hz &#183; plan view, seen from above</text>
  <text x="64" y="214" font-size="12" fill="#8a94a3">It bends in the plane of this page: the tip yaws, it never tilts, so there is no gravity coupling.</text>

  <!-- enclosure -->
  <rect x="80" y="242" width="530" height="132" rx="8" fill="#fafbfc" stroke="#c9d2dc" stroke-dasharray="5,4"/>
  <text x="92" y="262" font-size="11" fill="#8a94a3">sealed box, 30 mm clearance all round (drafts, not dust)</text>

  <!-- bench / clamp -->
  <rect x="86" y="284" width="16" height="48" rx="2" fill="#c3cbd6"/>
  <rect x="102" y="288" width="113" height="12" rx="2" fill="#8a94a3"/>
  <rect x="102" y="316" width="113" height="12" rx="2" fill="#8a94a3"/>
  <text x="158" y="352" font-size="11" fill="#6b7684" text-anchor="middle">vice or two hardwood</text>
  <text x="158" y="366" font-size="11" fill="#6b7684" text-anchor="middle">blocks, clamped hard</text>

  <!-- deflected ghosts -->
  <path d="M 215 308 C 330 308 450 314 550 322" fill="none" stroke="#c9dcee" stroke-width="2"/>
  <path d="M 215 308 C 330 308 450 302 550 294" fill="none" stroke="#c9dcee" stroke-width="2"/>
  <!-- the blade at rest -->
  <line x1="102" y1="308" x2="550" y2="308" stroke="#1c2430" stroke-width="3"/>

  <!-- tip mass + sensor -->
  <rect x="512" y="292" width="26" height="32" rx="2" fill="#4a5563"/>
  <rect x="540" y="288" width="34" height="40" rx="3" fill="#eef4fa" stroke="#3d7ebd"/>
  <text x="557" y="312" font-size="9" fill="#2c5f8f" text-anchor="middle">IMU</text>
  <text x="545" y="352" font-size="11" fill="#6b7684" text-anchor="middle">16 g of washers</text>
  <text x="545" y="366" font-size="11" fill="#6b7684" text-anchor="middle">+ Modulino, 3.9 g</text>

  <!-- swing arrow -->
  <line x1="596" y1="284" x2="596" y2="332" stroke="#3d7ebd" stroke-width="2" marker-start="url(#swing)" marker-end="url(#swing)"/>

  <!-- dimensions -->
  <line x1="102" y1="398" x2="215" y2="398" stroke="#8a94a3" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="158" y="392" font-size="11.5" fill="#6b7684" text-anchor="middle">77 mm clamped</text>
  <line x1="215" y1="398" x2="550" y2="398" stroke="#8a94a3" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="382" y="392" font-size="11.5" fill="#6b7684" text-anchor="middle">223 mm free</text>
  <text x="382" y="416" font-size="11.5" fill="#8a94a3" text-anchor="middle">one 300 mm hacksaw blade, 12.7 x 0.635 mm</text>

  <rect x="80" y="436" width="530" height="72" rx="8" fill="#f7f8fa"/>
  <text x="96" y="458" font-size="12.5" fill="#4a5563">Slide the clamp to tune: <tspan font-weight="600">10 mm shorter raises f0 by 7.5%</tspan>. Stiff-axis mode sits at 80 Hz,</text>
  <text x="96" y="478" font-size="12.5" fill="#4a5563">decades clear of the 0.7&#8211;12 Hz band. Root stress at 1 g of tip motion is 60 MPa, against</text>
  <text x="96" y="498" font-size="12.5" fill="#4a5563">roughly 1000 MPa of yield &#8212; the blade is in no danger, the clamp and the cable are.</text>

  <!-- ============ RIGHT: the gain ============ -->
  <rect x="680" y="150" width="480" height="380" rx="12" fill="#ffffff" stroke="#dde2e9"/>
  <rect x="680" y="150" width="480" height="4" rx="2" fill="#e8a33d"/>
  <text x="704" y="192" font-size="15" font-weight="700" fill="#1c2430">What the resonance is actually worth</text>

  <!-- axes -->
  <line x1="700" y1="470" x2="1130" y2="470" stroke="#c3cbd6" stroke-width="1"/>
  <line x1="700" y1="210" x2="700" y2="470" stroke="#c3cbd6" stroke-width="1"/>

  <!-- gridlines -->
  <line x1="700" y1="422.7" x2="1120" y2="422.7" stroke="#e63946" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1116" y="437" font-size="10.5" fill="#e63946" text-anchor="end">1.0 &#183; break-even against no blade at all</text>
  <text x="694" y="426" font-size="10.5" fill="#8a94a3" text-anchor="end">1</text>
  <line x1="700" y1="375.5" x2="1120" y2="375.5" stroke="#eef1f5" stroke-width="1"/>
  <line x1="700" y1="328.2" x2="1120" y2="328.2" stroke="#eef1f5" stroke-width="1"/>
  <line x1="700" y1="280.9" x2="1120" y2="280.9" stroke="#eef1f5" stroke-width="1"/>
  <line x1="700" y1="233.6" x2="1120" y2="233.6" stroke="#eef1f5" stroke-width="1"/>
  <text x="694" y="379" font-size="10.5" fill="#8a94a3" text-anchor="end">2</text>
  <text x="694" y="332" font-size="10.5" fill="#8a94a3" text-anchor="end">3</text>
  <text x="694" y="285" font-size="10.5" fill="#8a94a3" text-anchor="end">4</text>
  <text x="694" y="237" font-size="10.5" fill="#8a94a3" text-anchor="end">5</text>

  <!-- band-pass reference -->
  <line x1="700" y1="402.4" x2="1120" y2="402.4" stroke="#2f9e44" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- curves -->
  <polyline fill="none" stroke="#3d7ebd" stroke-width="2.5"
            points="700,438.5 742,386.4 784,356.1 826,332.3 868,312.1 910,294.1 952,277.8 1036,248.9 1120,223.3"/>
  <polyline fill="none" stroke="#e8a33d" stroke-width="2.5"
            points="700,438.5 742,394.7 784,375.9 826,364.3 868,356.2 910,350.3 952,345.7 1036,339.1 1120,334.6"/>
  <polyline fill="none" stroke="#e63946" stroke-width="2.5"
            points="700,438.5 742,413.7 784,408.4 826,405.9 868,404.6 910,403.7 952,403.0 1036,402.2 1120,401.7"/>

  <text x="1116" y="216" font-size="11.5" fill="#3d7ebd" text-anchor="end">site silent (r = 0)</text>
  <text x="1116" y="330" font-size="11.5" fill="#e8a33d" text-anchor="end">r = 0.2</text>
  <text x="1116" y="396" font-size="11.5" fill="#e63946" text-anchor="end">r = 0.5</text>
  <text x="716" y="399" font-size="10.5" fill="#2f9e44">1.43, what the band-pass already gave, free</text>

  <text x="700" y="488" font-size="10.5" fill="#8a94a3">0</text>
  <text x="784" y="488" font-size="10.5" fill="#8a94a3" text-anchor="middle">10</text>
  <text x="868" y="488" font-size="10.5" fill="#8a94a3" text-anchor="middle">20</text>
  <text x="952" y="488" font-size="10.5" fill="#8a94a3" text-anchor="middle">30</text>
  <text x="1036" y="488" font-size="10.5" fill="#8a94a3" text-anchor="middle">40</text>
  <text x="1120" y="488" font-size="10.5" fill="#8a94a3" text-anchor="middle">50</text>
  <text x="910" y="508" font-size="12" fill="#6b7684" text-anchor="middle">quality factor Q of the blade</text>
  <text x="704" y="214" font-size="12" fill="#6b7684">effective gain on the trigger</text>

  <!-- ============ FOOTER ============ -->
  <rect x="40" y="552" width="1120" height="112" rx="12" fill="#ffffff" stroke="#dde2e9"/>
  <rect x="40" y="552" width="4" height="112" rx="2" fill="#8a94a3"/>

  <text x="72" y="586" font-size="13.5" font-weight="600" fill="#4a5563">A resonance multiplies a tone by Q,</text>
  <text x="72" y="606" font-size="13.5" fill="#6b7684">a broadband wavetrain only by the square</text>
  <text x="72" y="626" font-size="13.5" fill="#6b7684">root of it. Q = 20 at 4 Hz is a gain of 5.0,</text>
  <text x="72" y="646" font-size="13.5" fill="#6b7684">not 20, against a 5.21 Hz detector.</text>

  <text x="450" y="586" font-size="13.5" font-weight="600" fill="#4a5563">One axis out of three.</text>
  <text x="450" y="606" font-size="13.5" fill="#6b7684">The detector reports a 3-vector magnitude and</text>
  <text x="450" y="626" font-size="13.5" fill="#6b7684">the blade bends one way, which costs a third.</text>
  <text x="450" y="646" font-size="13.5" fill="#6b7684">Below Q = 1 the mount is worse than no mount.</text>

  <text x="828" y="586" font-size="13.5" font-weight="600" fill="#4a5563">r decides, and r is not known.</text>
  <text x="828" y="606" font-size="13.5" fill="#6b7684">Ground noise is amplified too, so the gain</text>
  <text x="828" y="626" font-size="13.5" fill="#6b7684">saturates at 1/r. The floor measurement bounds</text>
  <text x="828" y="646" font-size="13.5" fill="#6b7684">r below 0.5 and cannot say more than that.</text>

  <text x="40" y="686" font-size="12.5" fill="#8a94a3">Sismo-LA &#183; every figure here is CALCULATED, none is measured on the board &#183; docs/mechanical-gain.md gives the protocol that would settle it</text>
</svg>
