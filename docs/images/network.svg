<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- A diagram, not a page: the reasoning lives in the README next to it.
       The three radii are exact - each equals the distance from its station to
       the epicenter - so the circles really do meet at one point. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a3"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="#f7f8fa"/>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#1c2430">One station draws a ring. Three draw a point.</text>
  <text x="40" y="80" font-size="15" fill="#6b7684">A station measures how far, never which way.</text>

  <!-- ================= one station ================= -->
  <rect x="40" y="104" width="420" height="396" rx="12" fill="#ffffff" stroke="#dde2e9"/>
  <rect x="40" y="104" width="420" height="4" rx="2" fill="#e63946"/>
  <text x="64" y="138" font-size="14" font-weight="700" fill="#1c2430">1 &#183; one station</text>

  <circle cx="250" cy="340" r="115" fill="none" stroke="#e63946" stroke-width="24" opacity="0.12"/>
  <circle cx="250" cy="340" r="115" fill="none" stroke="#e63946" stroke-width="2" stroke-dasharray="7,6"/>
  <text x="250" y="200" font-size="12" font-style="italic" fill="#a32330" text-anchor="middle">somewhere on this ring</text>

  <line x1="250" y1="340" x2="141" y2="340" stroke="#8a94a3" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="182" y="318" width="26" height="18" rx="4" fill="#ffffff"/>
  <text x="195" y="331" font-size="12.5" font-style="italic" fill="#4a5563" text-anchor="middle">R</text>

  <circle cx="331" cy="259" r="11" fill="#fdf0f1" stroke="#e8a0a6"/>
  <text x="331" y="263" font-size="11" fill="#a32330" text-anchor="middle">?</text>
  <circle cx="169" cy="259" r="11" fill="#fdf0f1" stroke="#e8a0a6"/>
  <text x="169" y="263" font-size="11" fill="#a32330" text-anchor="middle">?</text>
  <circle cx="169" cy="421" r="11" fill="#fdf0f1" stroke="#e8a0a6"/>
  <text x="169" y="425" font-size="11" fill="#a32330" text-anchor="middle">?</text>
  <circle cx="331" cy="421" r="11" fill="#fdf0f1" stroke="#e8a0a6"/>
  <text x="331" y="425" font-size="11" fill="#a32330" text-anchor="middle">?</text>

  <rect x="238" y="328" width="24" height="24" rx="6" fill="#00878F"/>
  <text x="250" y="382" font-size="12" fill="#4a5563" text-anchor="middle">station</text>

  <!-- ================= three stations ================= -->
  <rect x="490" y="104" width="670" height="396" rx="12" fill="#ffffff" stroke="#dde2e9"/>
  <rect x="490" y="104" width="670" height="4" rx="2" fill="#2f9e44"/>
  <text x="514" y="138" font-size="14" font-weight="700" fill="#1c2430">2 &#183; three stations</text>
  <text x="514" y="162" font-size="12" font-style="italic" fill="#8a94a3">each knows only its own radius</text>

  <circle cx="743.5" cy="343.5" r="122.25" fill="none" stroke="#3d7ebd" stroke-width="14" opacity="0.13"/>
  <circle cx="743.5" cy="343.5" r="122.25" fill="none" stroke="#3d7ebd" stroke-width="2"/>
  <circle cx="923.5" cy="276" r="79.61" fill="none" stroke="#e8a33d" stroke-width="14" opacity="0.16"/>
  <circle cx="923.5" cy="276" r="79.61" fill="none" stroke="#e8a33d" stroke-width="2"/>
  <circle cx="946" cy="375" r="92.66" fill="none" stroke="#2f9e44" stroke-width="14" opacity="0.13"/>
  <circle cx="946" cy="375" r="92.66" fill="none" stroke="#2f9e44" stroke-width="2"/>

  <line x1="743.5" y1="343.5" x2="865" y2="330" stroke="#3d7ebd" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.6"/>
  <line x1="923.5" y1="276" x2="865" y2="330" stroke="#e8a33d" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.7"/>
  <line x1="946" y1="375" x2="865" y2="330" stroke="#2f9e44" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.6"/>

  <rect x="735.5" y="335.5" width="16" height="16" rx="4" fill="#3d7ebd"/>
  <text x="743.5" y="323.5" font-size="12" fill="#4a5563" text-anchor="middle">A</text>
  <rect x="915.5" y="268" width="16" height="16" rx="4" fill="#e8a33d"/>
  <text x="923.5" y="256" font-size="12" fill="#4a5563" text-anchor="middle">B</text>
  <rect x="938" y="367" width="16" height="16" rx="4" fill="#2f9e44"/>
  <text x="946" y="411" font-size="12" fill="#4a5563" text-anchor="middle">C</text>

  <circle cx="865" cy="330" r="12" fill="#e63946" opacity="0.20"/>
  <circle cx="865" cy="330" r="5" fill="#e63946"/>
  <line x1="858" y1="322" x2="832" y2="292" stroke="#8a94a3" stroke-width="1.2"/>
  <text x="826" y="288" font-size="12.5" font-weight="600" fill="#a32330" text-anchor="end">epicenter</text>

  <text x="40" y="524" font-size="11" fill="#8a94a3">Sismo-LA &#183; a geometric argument, not a measurement &#183; one station exists &#183; editable source: docs/images/network.svg</text>
</svg>
