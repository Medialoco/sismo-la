# Arduino App Lab manifest.
#
# An App is this folder: app.yaml + python/ (runs on the Dragonwing MPU under
# Debian) + sketch/ (runs on the STM32U585 MCU under Zephyr). `arduino-app-cli
# app start .` builds the sketch, flashes the MCU, installs python/requirements
# and launches python/main.py, wiring the two halves over the Bridge.
name: sismo-la
icon: 🌎
description: >-
  A home seismograph on Arduino UNO Q. A small accelerometer records shakes;
  the USGS catalog says which ones were earthquakes; from those pairs the
  station learns magnitude and distance for this installation, then runs that
  model offline.

# The dashboard served by python/main.py.
ports:
  - 8000

# No Bricks: the map dashboard is served directly by the Python half, and the
# quake-vs-noise filter is the online logistic regression in
# python/classifier.py. Swapping that filter for an Edge Impulse model via the
# AI brick is the planned upgrade.
bricks: []
