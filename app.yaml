# App Lab manifest (SKELETON TO ADAPT to the real App Lab schema).
# Goal: declare the Python app (MPU), the MCU sketch and the bricks used.
name: sismo-la
description: Low-cost community seismograph for Los Angeles, calibrated via USGS.
version: 0.1.0

# Python application running under Debian Linux (Dragonwing QRB2210).
python:
  entrypoint: app/main.py
  requirements: app/requirements.txt

# Sketch running on the real-time MCU (STM32U585).
sketch:
  path: firmware/seismo_mcu/seismo_mcu.ino

# App Lab bricks to wire in (to confirm in the App Lab IDE).
bricks:
  - web        # dashboard (web/index.html)
  - ai         # Edge Impulse model: earthquake vs noise
