# Manifeste App Lab (SQUELETTE A ADAPTER selon le schema reel d'App Lab).
# But : declarer l'app Python (MPU), le sketch MCU et les bricks utilises.
name: sismo-la
description: Sismographe communautaire bas cout pour Los Angeles, etalonne via USGS.
version: 0.1.0

# Application Python executee sous Debian Linux (Dragonwing QRB2210).
python:
  entrypoint: app/main.py
  requirements: app/requirements.txt

# Sketch execute sur le MCU temps reel (STM32U585).
sketch:
  path: firmware/seismo_mcu/seismo_mcu.ino

# Bricks App Lab a brancher (a confirmer dans l'IDE App Lab).
bricks:
  - web        # dashboard (web/index.html)
  - ai         # modele Edge Impulse : seisme vs bruit
